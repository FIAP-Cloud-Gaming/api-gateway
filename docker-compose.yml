name: fcg-gateway

services:
  # ======================================
  # Infrastructure
  # ======================================
  postgres-identity:
    image: postgres:18.1-alpine
    container_name: fcg-identity-postgres
    environment:
      POSTGRES_DB: identity_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-identity-data:/var/lib/postgresql/data
    networks:
      - fcg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-catalog:
    image: postgres:18.1-alpine
    container_name: fcg-catalog-postgres
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-catalog-data:/var/lib/postgresql/data
    networks:
      - fcg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-payment:
    image: postgres:18.1-alpine
    container_name: fcg-payment-postgres
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres-payment-data:/var/lib/postgresql/data
    networks:
      - fcg-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:latest
    container_name: fcg-mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - fcg-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:latest
    container_name: fcg-redis
    networks:
      - fcg-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  elasticsearch:
    image: elasticsearch:9.0.2
    container_name: fcg-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      - fcg-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kibana:
    image: kibana:9.0.2
    container_name: fcg-kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - fcg-network

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: fcg-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - fcg-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ======================================
  # Observability
  # ======================================
  jaeger:
    image: jaegertracing/jaeger:latest
    container_name: fcg-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    networks:
      - fcg-network

  loki:
    image: grafana/loki:latest
    container_name: fcg-loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - fcg-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  grafana:
    image: grafana/grafana:latest
    container_name: fcg-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    depends_on:
      - loki
      - jaeger
    networks:
      - fcg-network
    volumes:
      - grafana-data:/var/lib/grafana

  # ======================================
  # Microservices
  # ======================================
  identity.api:
    image: ${DOCKER_REGISTRY:-fcg}/identity.api:${TAG:-latest}
    build:
      context: ../Identity
      dockerfile: src/Identity.API/Dockerfile
    container_name: fcg-identity-api
    depends_on:
      postgres-identity:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - fcg-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  catalog.api:
    image: ${DOCKER_REGISTRY:-fcg}/catalog.api:${TAG:-latest}
    build:
      context: ../Catalog
      dockerfile: src/Catalog.API/Dockerfile
    container_name: fcg-catalog-api
    depends_on:
      postgres-catalog:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - fcg-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  payment.api:
    image: ${DOCKER_REGISTRY:-fcg}/payment.api:${TAG:-latest}
    build:
      context: ../Payment
      dockerfile: src/Payment.API/Dockerfile
    container_name: fcg-payment-api
    depends_on:
      postgres-payment:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      jaeger:
        condition: service_started
    networks:
      - fcg-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  gateway.api:
    image: ${DOCKER_REGISTRY:-fcg}/gateway.api:${TAG:-latest}
    build:
      context: .
      dockerfile: src/Gateway.API/Dockerfile
    container_name: fcg-gateway-api
    depends_on:
      identity.api:
        condition: service_healthy
      catalog.api:
        condition: service_healthy
      payment.api:
        condition: service_healthy
    networks:
      - fcg-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ======================================
  # Serverless (Azure Functions)
  # ======================================
  functions:
    image: ${DOCKER_REGISTRY:-fcg}/functions:${TAG:-latest}
    build:
      context: ../Serverless
      dockerfile: src/Functions/Dockerfile
    container_name: fcg-functions
    environment:
      - AzureWebJobsStorage=UseDevelopmentStorage=true
      - FUNCTIONS_WORKER_RUNTIME=dotnet-isolated
      - RabbitMQ=amqp://guest:guest@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
      payment.api:
        condition: service_healthy
      catalog.api:
        condition: service_healthy
    networks:
      - fcg-network

networks:
  fcg-network:
    driver: bridge

volumes:
  postgres-identity-data:
  postgres-catalog-data:
  postgres-payment-data:
  mongo-data:
  elasticsearch-data:
  rabbitmq-data:
  grafana-data:
