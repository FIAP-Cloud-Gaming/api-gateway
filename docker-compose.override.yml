services:
# ======================================
# Infrastructure (DEV Ports)
# ======================================
  postgres-identity:
    ports:
      - "5432:5432"

  postgres-catalog:
    ports:
      - "5433:5432"

  postgres-payment:
    ports:
      - "5434:5432"

  mongo:
    ports:
      - "27017:27017"

  redis:
    ports:
      - "6379:6379"

  elasticsearch:
    ports:
      - "9200:9200"

  kibana:
    ports:
      - "5601:5601"

  rabbitmq:
    ports:
      - "5672:5672"
      - "15672:15672"

# ======================================
# Observability (DEV Ports)
# ======================================
  jaeger:
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  loki:
    ports:
      - "3100:3100"

  grafana:
    ports:
      - "3000:3000"

# ======================================
# Identity API (DEV Ports + Env)
# ======================================
  identity.api:
    ports:
      - "5001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__IdentityDb=Host=postgres-identity;Port=5432;Database=identity_db;Username=postgres;Password=postgres
      - ConnectionStrings__RabbitMQ=amqp://guest:guest@rabbitmq:5672
      - JwtSettings__Secret=your-super-secret-key-min-32-chars-long-for-development-only
      - JwtSettings__Issuer=fcg-identity-api
      - JwtSettings__Audience=fcg-services
      - JwtSettings__AccessTokenExpirationMinutes=60
      - Loki__Uri=http://loki:3100
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

# ======================================
# Catalog API (DEV Ports + Env)
# ======================================
  catalog.api:
    ports:
      - "5002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CatalogDB=Host=postgres-catalog;Port=5432;Database=catalog_db;Username=postgres;Password=postgres
      - ConnectionStrings__MongoDB=mongodb://mongo:27017
      - ConnectionStrings__Redis=redis:6379
      - ConnectionStrings__Elasticsearch=http://elasticsearch:9200
      - MongoDB__DatabaseName=CatalogDB
      - Elasticsearch__Uri=http://elasticsearch:9200
      - JwtSettings__Secret=your-super-secret-key-min-32-chars-long-for-development-only
      - JwtSettings__Issuer=fcg-identity-api
      - JwtSettings__Audience=fcg-services
      - ConnectionStrings__RabbitMQ=amqp://guest:guest@rabbitmq:5672
      - Loki__Uri=http://loki:3100
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

# ======================================
# Payment API (DEV Ports + Env)
# ======================================
  payment.api:
    ports:
      - "5003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__PaymentDB=Host=postgres-payment;Port=5432;Database=payment_db;Username=postgres;Password=postgres
      - Elasticsearch__Uri=http://elasticsearch:9200
      - JwtSettings__Secret=your-super-secret-key-min-32-chars-long-for-development-only
      - JwtSettings__Issuer=fcg-identity-api
      - JwtSettings__Audience=fcg-services
      - ConnectionStrings__RabbitMQ=amqp://guest:guest@rabbitmq:5672
      - Loki__Uri=http://loki:3100
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317

# ======================================
# Gateway API (DEV Ports + Env)
# ======================================
  gateway.api:
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - JwtSettings__Secret=your-super-secret-key-min-32-chars-long-for-development-only
      - JwtSettings__Issuer=fcg-identity-api
      - JwtSettings__Audience=fcg-services
      - ReverseProxy__Clusters__identity-cluster__Destinations__identity-api__Address=http://identity.api:8080
      - ReverseProxy__Clusters__catalog-cluster__Destinations__catalog-api__Address=http://catalog.api:8080
      - ReverseProxy__Clusters__payment-cluster__Destinations__payment-api__Address=http://payment.api:8080
      - Loki__Uri=http://loki:3100
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
